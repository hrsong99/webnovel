    <path d="M790 1120l10 22 25 3-18 17 4 24-21-12-21 12 5-24-19-17 25-3z" opacity=".55"/>
    <path d="M410 1120l10 22 25 3-18 17 4 24-21-12-21 12 5-24-19-17 25-3z" opacity=".55"/>
    <path d="M270 885l10 22 25 3-18 17 4 24-21-12-21 12 5-24-19-17 25-3z" opacity=".72"/>
    <path d="M355 630l11 24 27 4-20 18 5 27-23-13-24 13 6-27-20-18 27-4z" opacity=".86"/>
  </g>
  <circle cx="600" cy="980" r="180" fill="url(#glow)" filter="url(#blur)" opacity=".28"/>
  <path d="M430 1290V800l170-120 170 120v490" fill="#080a10" stroke="#d8b56a" stroke-opacity=".35" stroke-width="5"/>
  <path d="M470 1290V830h260v460" fill="#101322"/>
  <path d="M600 825v465" stroke="#d8b56a" stroke-opacity=".25" stroke-width="3"/>
