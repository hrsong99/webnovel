  <text x="600" y="128" fill="#d8b56a" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" letter-spacing="9">DOPAMINE-FIRST MURIM · VOLUME ONE</text>
  <text x="600" y="245" fill="#f3eee2" text-anchor="middle" font-family="serif" font-size="68" font-weight="700">SEVEN REGRESSORS FELL.</text>
  <text x="600" y="330" fill="#f3eee2" text-anchor="middle" font-family="serif" font-size="63" font-weight="700">ONLY THE INN BOY REMAINED.</text>
  <line x1="390" y1="390" x2="810" y2="390" stroke="#a7453b" stroke-width="5"/>
  <text x="600" y="1505" fill="#d8b56a" text-anchor="middle" font-family="sans-serif" font-size="31">THEIR 9,431 FAILURES BECAME HIS MARTIAL ART</text>
  <text x="600" y="1665" fill="#918a82" text-anchor="middle" font-family="sans-serif" font-size="24" letter-spacing="6">NITTY GRITTY NOVEL LAB</text>
</svg>
