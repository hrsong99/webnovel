<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Seven Regressors Fell. Only the Inn Boy Remained.</title>
  <desc id="desc">A dark inn door encircled by seven stars, with one inn boy standing below</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".55" stop-color="#15192a"/><stop offset="1" stop-color="#301517"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f3c572" stop-opacity=".8"/><stop offset="1" stop-color="#f3c572" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="600" cy="980" r="420" fill="none" stroke="#d8b56a" stroke-opacity=".13" stroke-width="2"/>
  <g fill="#e7d9b5">
    <path d="M600 510l13 28 31 4-23 21 6 31-27-15-27 15 6-31-23-21 31-4z"/>
    <path d="M845 630l11 24 27 4-20 18 5 27-23-13-24 13 6-27-20-18 27-4z" opacity=".86"/>
