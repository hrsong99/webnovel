<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">무림철폐론자 표지</title>
  <desc id="desc">먹빛 산과 붉게 갈라진 원, 대장장이의 망치가 있는 미니멀한 무협 소설 표지</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cd"/>
      <stop offset=".55" stop-color="#d8ccb6"/>
      <stop offset="1" stop-color="#b9a98e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ba3e31"/><stop offset="1" stop-color="#6f1715"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1800" fill="url(#paper)"/>
  <rect width="1200" height="1800" filter="url(#grain)" opacity=".34"/>

  <circle cx="765" cy="535" r="252" fill="none" stroke="#201a16" stroke-width="22" opacity=".92"/>
  <path d="M790 274 L744 434 L810 516 L757 628 L815 792" fill="none" stroke="url(#red)" stroke-width="38" stroke-linecap="square"/>
  <circle cx="765" cy="535" r="180" fill="none" stroke="#201a16" stroke-width="2" opacity=".25"/>

  <g opacity=".93">
    <path d="M0 1150 L180 940 L305 1080 L500 805 L690 1030 L865 860 L1200 1120 L1200 1440 L0 1440 Z" fill="#342d27"/>
    <path d="M0 1275 L220 1105 L400 1230 L595 1025 L765 1200 L950 1055 L1200 1245 L1200 1500 L0 1500 Z" fill="#1f1b18"/>
    <path d="M0 1410 C180 1350 300 1450 470 1370 C640 1290 770 1435 930 1355 C1050 1300 1130 1335 1200 1370 L1200 1800 L0 1800 Z" fill="#151210"/>
  </g>

  <g transform="translate(650 1000) rotate(-18)">
    <rect x="-22" y="90" width="44" height="380" rx="15" fill="#8b6e4d"/>
    <path d="M-150 20 H145 L115 145 H-105 Z" fill="#211b17"/>
    <path d="M-138 36 H130" stroke="#8f8171" stroke-width="10" opacity=".45"/>
  </g>

  <g fill="#201a16">
    <text x="95" y="190" font-family="Georgia,serif" font-size="28" letter-spacing="9">NITTY GRITTY NOVEL LAB</text>
    <text x="92" y="430" font-family="Batang,Noto Serif KR,serif" font-size="118" font-weight="700" letter-spacing="-8">무림</text>
    <text x="92" y="555" font-family="Batang,Noto Serif KR,serif" font-size="118" font-weight="700" letter-spacing="-8">철폐론자</text>
    <text x="98" y="630" font-family="Batang,Noto Serif KR,serif" font-size="34" letter-spacing="12" fill="#7d2a22">상처를 닫는 대장장이</text>
  </g>

  <g transform="translate(930 1480) rotate(-7)">
    <rect x="-72" y="-72" width="144" height="144" fill="none" stroke="#a23328" stroke-width="8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Batang,serif" font-size="36" font-weight="700" fill="#a23328">第一</text>
    <text x="0" y="40" text-anchor="middle" font-family="Batang,serif" font-size="36" font-weight="700" fill="#a23328">卷</text>
  </g>
  <text x="95" y="1680" fill="#b7a890" font-family="Georgia,serif" font-size="20" letter-spacing="6">THE MURIM ABOLITIONIST · VOLUME ONE</text>
</svg>
