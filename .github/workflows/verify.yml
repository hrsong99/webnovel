name: Verify novel and container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test, validate, and build reader
        run: |
          python3 -m unittest -v
          python3 scripts/novel.py validate
          python3 scripts/novel.py build
      - name: Build production container
        run: docker build -t murim-abolitionist:${{ github.sha }} .
