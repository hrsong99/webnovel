name: Verify novel and container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the repository release gate
        run: python3 scripts/release_check.py
      - name: Build production container
        run: docker build -t webnovel-catalog:${{ github.sha }} .
